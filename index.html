<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Card</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="card">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>

    <div class="profile-pic">
      <img src="img-png.webp" alt="Profile Photo">
    </div>
    <h2>CodingLab</h2>
    <p>YouTuber &amp; Blogger</p>
    <div class="social">
      <a href="#" aria-label="X / Twitter"><i class="fab fa-x-twitter"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    </div>
    <div class="buttons">
      <button type="button" class="btn primary-btn">Subscribe</button>
      <button type="button" class="btn secondary-btn">Message</button>
    </div>
    <div class="stats">
      <div class="stat-item"><i class="fas fa-heart"></i> <span>80k</span></div>
      <div class="stat-item"><i class="fas fa-thumbs-up"></i> <span>20k</span></div>
      <div class="stat-item"><i class="fas fa-eye"></i> <span>12k</span></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
